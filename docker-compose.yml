services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: steamiq_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steamiq}
      POSTGRES_USER: ${POSTGRES_USER:-steamiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steamiq} -d ${POSTGRES_DB:-steamiq}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis (Job Queue) ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: steamiq_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steamiq_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database — resolved from .env at compose time
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-steamiq}
      POSTGRES_USER: ${POSTGRES_USER:-steamiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # CORS — explicit origin list (ADR 0001, Decision 4)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3000}
      # Steam API key from .env
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # App config
      APP_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      # Mount source for hot-reload in development
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    container_name: steamiq_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # ADR 0001, Decision 7: URL always from env, never hardcoded
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "3001:3000"

  # ── RQ Worker ─────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steamiq_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-steamiq}
      POSTGRES_USER: ${POSTGRES_USER:-steamiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/0
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "python -c 'from services.ingestion_runner import start_worker; start_worker()'"]

volumes:
  postgres_data:
    driver: local
